name: Deploy to Firebase Hosting — Vantage AI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Preview (PRs)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VANTAGE_AI_EDA2C }}
          projectId: vantage-ai-perf-2026
          target: vantage-ai-app
          channelId: pr-${{ github.event.pull_request.number }}

      - name: Deploy Live (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VANTAGE_AI_EDA2C }}
          projectId: vantage-ai-perf-2026
          target: vantage-ai-app
          channelId: live
