name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - perf/windows-lag-fix
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting (Preview -- PRs)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VANTAGE_AI_PERF }}
          projectId: vantage-ai-perf-2026
          channelId: pr-${{ github.event.pull_request.number }}

      - name: Deploy to Firebase Hosting (Live -- main branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VANTAGE_AI_PERF }}
          projectId: vantage-ai-perf-2026
          channelId: live
